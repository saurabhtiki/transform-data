[project]
name = "transform-data"
version = "0.1.0"
description = "Reusable Django add-on: load data, transform it step by step, download Excel / JSON."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-datatable",
    "data-core",
    "pandas>=3.0",
    "numpy>=2.0",
    "xlsxwriter>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "python-dotenv>=1.0",
    "waitress>=3.0",
    "whitenoise>=6.8",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transform_data"]

[tool.uv.sources]
django-datatable = { git = "https://github.com/saurabhtiki/django-datatable" }
# Local for now. Once data-core is on GitHub, switch to:
# data-core = { git = "https://github.com/<owner>/data-core" }
data-core = { path = "../data-core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "demo.settings.pytest"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
# Ported as-is from the Streamlit prototype (its own style); linted there.
extend-exclude = ["transform_data/engine", "tests/engine"]

[tool.ruff.lint]
extend-ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"demo/settings/*.py" = ["F403", "F405"]
